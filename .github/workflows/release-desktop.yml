name: Release the desktop app

# A tag like `desktop-v1.0.0` builds the Windows setup .exe and a portable zip,
# writes each SHA-256 next to it, and publishes all of them on a GitHub release.
# The tag is the only version: both artifacts and the app's own version come
# from it. The same build is available locally via scripts\build-desktop.ps1.
on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installer:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read the version from the tag
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#desktop-v}" >> "$GITHUB_OUTPUT"

      - name: Install packages
        working-directory: desktop-flutter
        run: flutter pub get

      - name: Cache FFmpeg
        uses: actions/cache@v6
        with:
          path: |
            desktop-flutter/third_party/ffmpeg
            desktop-flutter/third_party/cache
          key: ffmpeg-${{ hashFiles('desktop-flutter/tool/fetch_ffmpeg.ps1') }}

      - name: Fetch FFmpeg
        working-directory: desktop-flutter
        shell: powershell
        run: ./tool/fetch_ffmpeg.ps1

      - name: Write the build config
        working-directory: desktop-flutter
        env:
          SUPABASE_URL: ${{ secrets.DESKTOP_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.DESKTOP_SUPABASE_ANON_KEY }}
        # `config/prod.json` is gitignored, so the release build has to make it.
        # Both values are the public client address and the publishable anon key;
        # they go in as secrets so no key lives in the repository.
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Set the repo secrets DESKTOP_SUPABASE_URL and DESKTOP_SUPABASE_ANON_KEY." >&2
            exit 1
          fi
          mkdir -p config
          printf '{\n  "SUPABASE_URL": "%s",\n  "SUPABASE_ANON_KEY": "%s",\n  "UPDATE_MANIFEST_URL": ""\n}\n' \
            "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > config/prod.json

      - name: Build the app
        working-directory: desktop-flutter
        run: >-
          flutter build windows --release
          --build-name=${{ steps.version.outputs.value }}
          --build-number=${{ github.run_number }}
          --dart-define-from-file=config/prod.json

      - name: Build the portable zip
        working-directory: desktop-flutter
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.value }}"
          $rel = "build\windows\x64\runner\Release"
          $dist = Join-Path (Get-Item ..).FullName "dist-desktop"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $stage = Join-Path $dist "portable\FlowPost-$v"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$rel\*" $stage -Recurse
          # The app resolves FFmpeg at <exe>\ffmpeg\bin, so mirror the installer layout.
          if (Test-Path "third_party\ffmpeg\bin") {
            Copy-Item "third_party\ffmpeg\bin" (Join-Path $stage "ffmpeg") -Recurse
          }
          Compress-Archive -Path $stage -DestinationPath (Join-Path $dist "FlowPost-portable.zip")

      - name: Build the installer
        working-directory: desktop-flutter
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.value }}" "installer\flowpost.iss"
          # A native tool that fails leaves PowerShell running happily.
          exit $LASTEXITCODE

      - name: Write the checksums
        shell: pwsh
        run: |
          $installer = "dist-desktop\FlowPostNativeSetup.exe"
          $zip = "dist-desktop\FlowPost-portable.zip"
          foreach ($artifact in @($installer, $zip)) {
            if (-not (Test-Path $artifact)) { throw "Expected artifact was not produced: $artifact" }
            $hash = (Get-FileHash -Algorithm SHA256 $artifact).Hash.ToLower()
            "$hash  $(Split-Path -Leaf $artifact)" | Set-Content -Encoding ascii "$artifact.sha256"
            Write-Host "SHA-256 $hash $artifact"
          }

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          ARTIFACTS=(
            dist-desktop/FlowPostNativeSetup.exe
            dist-desktop/FlowPostNativeSetup.exe.sha256
            dist-desktop/FlowPost-portable.zip
            dist-desktop/FlowPost-portable.zip.sha256
          )
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${ARTIFACTS[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${ARTIFACTS[@]}" \
              --title "FlowPost Studio $VERSION" \
              --notes "Windows build for FlowPost Studio $VERSION: FlowPostNativeSetup.exe (per-user installer) and FlowPost-portable.zip (extract and run, no install). Verify with: certutil -hashfile <file> SHA256"
          fi
