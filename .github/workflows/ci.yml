name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit the shipped dependencies
        run: npm audit --omit=dev --audit-level=high

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

  functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v7

      # Pinned to the version the check was green against locally; a Deno minor
      # bump can change the bundled lib types and fail a build nobody touched.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8

      # The *.test.ts files import vitest, which only Node resolves. Vitest runs
      # them in the web job; this job checks the code that is actually deployed.
      - name: Type check
        run: |
          deno check --no-lock \
            $(ls */index.ts) \
            $(ls _shared/*.ts | grep -v '\.test\.ts$')

  desktop:
    name: Desktop
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop-flutter
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version
        run: flutter --version

      - name: Install packages
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze
        run: flutter analyze lib test integration_test

      - name: Cache FFmpeg
        uses: actions/cache@v6
        with:
          path: |
            desktop-flutter/third_party/ffmpeg
            desktop-flutter/third_party/cache
          key: ffmpeg-${{ hashFiles('desktop-flutter/tool/fetch_ffmpeg.ps1') }}

      - name: Fetch FFmpeg
        shell: powershell
        run: ./tool/fetch_ffmpeg.ps1

      - name: Test
        run: flutter test
